media:
  input: assets/uploads
  output: /assets/uploads
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  rename: safe
content:
- name: profile
  label: ประวัติและติดต่อ / Profile & contact
  type: file
  path: _data/profile.json
  format: json
  fields:
  - name: first_name_en
    label: ชื่อภาษาอังกฤษ
    type: string
    required: true
  - name: last_name_en
    label: นามสกุลภาษาอังกฤษ
    type: string
    required: true
  - name: name_th
    label: ชื่อและคำนำหน้าภาษาไทย
    type: string
    required: true
  - name: hero_intro
    label: ข้อความแนะนำหน้าแรก (ไทย / TH)
    type: string
    required: true
  - name: hero_intro_en
    label: ข้อความแนะนำหน้าแรก (อังกฤษ / EN)
    type: string
    required: false
    description: เว้นว่างเพื่อใช้ข้อความเดิม / Leave blank to use the original text.
  - name: affiliation_short
    label: สังกัดสำหรับหน้าแรก (ไทย / TH)
    type: text
    required: true
  - name: affiliation_short_en
    label: สังกัดสำหรับหน้าแรก (อังกฤษ / EN)
    type: text
    required: false
    description: เว้นว่างเพื่อใช้ข้อความเดิม / Leave blank to use the original text.
  - name: biography
    label: ประวัติและสังกัด (ไทย / TH)
    type: text
    required: true
  - name: biography_en
    label: ประวัติและสังกัด (อังกฤษ / EN)
    type: text
    required: false
    description: เว้นว่างเพื่อใช้ข้อความเดิม / Leave blank to use the original text.
  - name: photo
    label: รูปโปรไฟล์
    type: image
    required: true
    options:
      extensions:
      - jpg
      - jpeg
      - png
      - webp
  - name: photo_alt
    label: คำอธิบายรูปสำหรับการเข้าถึง (ไทย / TH)
    type: string
    required: true
  - name: photo_alt_en
    label: คำอธิบายรูปสำหรับการเข้าถึง (อังกฤษ / EN)
    type: string
    required: false
    description: เว้นว่างเพื่อใช้ข้อความเดิม / Leave blank to use the original text.
  - name: roles
    label: บทบาททางวิชาการ / Academic roles
    type: object
    required: true
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: period
      label: ช่วงเวลา (ไทย / TH)
      type: string
      required: true
    - name: period_en
      label: ช่วงเวลา (อังกฤษ / EN)
      type: string
      required: false
      description: เว้นว่างเพื่อใช้ข้อความเดิม / Leave blank to use the original text.
    - name: title
      label: บทบาท/ตำแหน่ง (ไทย / TH)
      type: string
      required: true
    - name: title_en
      label: บทบาท/ตำแหน่ง (อังกฤษ / EN)
      type: string
      required: false
      description: เว้นว่างเพื่อใช้ข้อความเดิม / Leave blank to use the original text.
    - name: detail
      label: รายละเอียด (ไทย / TH)
      type: text
      required: false
    - name: detail_en
      label: รายละเอียด (อังกฤษ / EN)
      type: text
      required: false
      description: เว้นว่างเพื่อใช้ข้อความเดิม / Leave blank to use the original text.
  - name: professional_highlights
    label: ผลงานด้านการสอนและบริการวิชาการ / Professional highlights
    type: object
    required: false
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: category
      label: หมวดหมู่ (ไทย / TH)
      type: string
      required: true
    - name: category_en
      label: หมวดหมู่ (อังกฤษ / EN)
      type: string
      required: false
    - name: title
      label: ชื่อผลงาน (ไทย / TH)
      type: string
      required: true
    - name: title_en
      label: ชื่อผลงาน (อังกฤษ / EN)
      type: string
      required: false
    - name: detail
      label: รายละเอียดและวันที่ (ไทย / TH)
      type: text
      required: true
    - name: detail_en
      label: รายละเอียดและวันที่ (อังกฤษ / EN)
      type: text
      required: false
    - name: source_label
      label: ชื่อแหล่งอ้างอิง (ไทย / TH)
      type: string
      required: true
    - name: source_label_en
      label: ชื่อแหล่งอ้างอิง (อังกฤษ / EN)
      type: string
      required: false
    - name: source_url
      label: ลิงก์แหล่งอ้างอิง / Source URL
      type: string
      required: true
      pattern:
        regex: ^https://[^\s]+$
        message: ใส่ลิงก์ HTTPS ของแหล่งข้อมูลต้นฉบับ / Enter an HTTPS link to the primary source.
  - name: education
    label: ประวัติการศึกษา / Education
    type: object
    required: true
    list:
      collapsible:
        collapsed: true
        summary: '{degree} · พ.ศ. {year}'
    fields:
    - name: degree
      label: คุณวุฒิ (เช่น ปร.ด.) (ไทย / TH)
      type: string
      required: true
    - name: degree_en
      label: คุณวุฒิ (เช่น ปร.ด.) (อังกฤษ / EN)
      type: string
      required: false
      description: เว้นว่างเพื่อใช้ข้อความเดิม / Leave blank to use the original text.
    - name: field
      label: สาขาวิชา (ไทย / TH)
      type: string
      required: true
    - name: field_en
      label: สาขาวิชา (อังกฤษ / EN)
      type: string
      required: false
      description: เว้นว่างเพื่อใช้ข้อความเดิม / Leave blank to use the original text.
    - name: institution
      label: สถาบันการศึกษา (ไทย / TH)
      type: string
      required: true
    - name: institution_en
      label: สถาบันการศึกษา (อังกฤษ / EN)
      type: string
      required: false
      description: เว้นว่างเพื่อใช้ข้อความเดิม / Leave blank to use the original text.
    - name: country
      label: ประเทศ (ไทย / TH)
      type: string
      required: true
    - name: country_en
      label: ประเทศ (อังกฤษ / EN)
      type: string
      required: false
      description: เว้นว่างเพื่อใช้ข้อความเดิม / Leave blank to use the original text.
    - name: year
      label: ปีที่จบ (พ.ศ.)
      type: number
      required: true
      description: กรอก พ.ศ. ระบบแปลงเป็น ค.ศ. โดยอัตโนมัติในหน้าอังกฤษ / Enter a Buddhist Era year; the English page converts
        it to CE.
  - name: contact_intro
    label: ข้อความส่วนติดต่อ (ไทย / TH)
    type: text
    required: true
  - name: contact_intro_en
    label: ข้อความส่วนติดต่อ (อังกฤษ / EN)
    type: text
    required: false
    description: เว้นว่างเพื่อใช้ข้อความเดิม / Leave blank to use the original text.
  - name: contact_affiliation
    label: สังกัดและที่ติดต่อ (ไทย / TH)
    type: text
    required: true
  - name: contact_affiliation_en
    label: สังกัดและที่ติดต่อ (อังกฤษ / EN)
    type: text
    required: false
    description: เว้นว่างเพื่อใช้ข้อความเดิม / Leave blank to use the original text.
  - name: email
    label: อีเมล
    type: string
    required: true
    pattern:
      regex: ^[^@\s]+@[^@\s]+\.[^@\s]+$
      message: ใส่อีเมลที่ถูกต้อง
  - name: phone
    label: เบอร์โทรศัพท์ที่แสดงบนเว็บไซต์
    type: string
    required: true
    pattern:
      regex: ^[0-9+() .-]+$
      message: ใส่เบอร์โทรศัพท์ เช่น 094-1539680
  - name: phone_href
    label: ลิงก์โทรศัพท์สำหรับกดโทร
    type: string
    required: true
    pattern:
      regex: ^tel:\+[1-9][0-9]{7,14}$
      message: ใส่ลิงก์รูปแบบสากล เช่น tel:+66941539680
  - name: facebook
    label: Facebook
    type: string
    required: true
    pattern:
      regex: ^https://[^\s]+$
      message: ใส่ลิงก์ HTTPS ที่ถูกต้อง หรือเว้นว่างหากยังไม่มีลิงก์
  - name: instagram
    label: อินสตาแกรม / Instagram
    type: string
    required: false
    description: ลิงก์โปรไฟล์ Instagram เช่น https://www.instagram.com/comra357/ เว้นว่างเพื่อไม่แสดง / Instagram profile URL. Leave blank to hide.
    pattern:
      regex: ^(https://(www\.)?instagram\.com/[A-Za-z0-9._]+/?)?$
      message: ใส่ลิงก์โปรไฟล์ Instagram แบบ HTTPS หรือเว้นว่าง / Enter an HTTPS Instagram profile URL or leave blank.
  - name: github
    label: GitHub
    type: string
    required: true
    pattern:
      regex: ^https://[^\s]+$
      message: ใส่ลิงก์ HTTPS ที่ถูกต้อง หรือเว้นว่างหากยังไม่มีลิงก์
  - name: scholar
    label: Google Scholar
    type: string
    required: true
    pattern:
      regex: ^https://[^\s]+$
      message: ใส่ลิงก์ HTTPS ที่ถูกต้อง หรือเว้นว่างหากยังไม่มีลิงก์
  - name: orcid
    label: ORCID iD
    type: string
    required: false
    description: กรอกหมายเลข ORCID ของตนเองที่ตรวจสอบแล้ว (16 หลัก แบ่งด้วยขีด 4 กลุ่ม) เว้นว่างเพื่อไม่แสดง / Enter your verified ORCID iD in four hyphen-separated groups. Leave blank to hide.
    pattern:
      regex: ^([0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X])?$
      message: ใส่ ORCID iD ที่ถูกต้อง หรือเว้นว่าง / Enter a valid ORCID iD or leave blank.
  - name: meta_description
    label: คำอธิบายเว็บไซต์สำหรับผลการค้นหา (ไทย / TH)
    type: text
    required: true
  - name: meta_description_en
    label: คำอธิบายเว็บไซต์สำหรับผลการค้นหา (อังกฤษ / EN)
    type: text
    required: false
    description: เว้นว่างเพื่อใช้ข้อความเดิม / Leave blank to use the original text.
- name: interests
  label: ความสนใจด้านการวิจัย / Research interests
  type: file
  path: _data/interests.json
  format: json
  fields:
  - name: information_technology
    label: Information Technology
    type: object
    required: true
    fields:
    - name: title_th
      label: ชื่อหัวข้อภาษาไทย
      type: string
      required: true
    - name: title_en
      label: ชื่อหัวข้อภาษาอังกฤษ
      type: string
      required: true
  - name: ai
    label: AI
    type: object
    required: true
    fields:
    - name: title_th
      label: ชื่อหัวข้อภาษาไทย
      type: string
      required: true
    - name: title_en
      label: ชื่อหัวข้อภาษาอังกฤษ
      type: string
      required: true
  - name: meta_analysis
    label: Meta-Analysis
    type: object
    required: true
    fields:
    - name: title_th
      label: ชื่อหัวข้อภาษาไทย
      type: string
      required: true
    - name: title_en
      label: ชื่อหัวข้อภาษาอังกฤษ
      type: string
      required: true
  - name: education
    label: Education
    type: object
    required: true
    fields:
    - name: title_th
      label: ชื่อหัวข้อภาษาไทย
      type: string
      required: true
    - name: title_en
      label: ชื่อหัวข้อภาษาอังกฤษ
      type: string
      required: true
  - name: bibliometric_analysis
    label: Bibliometric Analysis
    type: object
    required: true
    fields:
    - name: title_th
      label: ชื่อหัวข้อภาษาไทย
      type: string
      required: true
    - name: title_en
      label: ชื่อหัวข้อภาษาอังกฤษ
      type: string
      required: true
- name: teaching
  label: งานสอนและความเชี่ยวชาญ / Teaching & expertise
  type: file
  path: _data/teaching.json
  format: json
  fields:
  - name: intro
    label: ข้อความแนะนำงานสอน (ไทย / TH)
    type: text
    required: true
  - name: intro_en
    label: ข้อความแนะนำงานสอน (อังกฤษ / EN)
    type: text
    required: false
    description: เว้นว่างเพื่อใช้ข้อความเดิม / Leave blank to use the original text.
  - name: expertise
    label: ความเชี่ยวชาญ
    type: object
    required: true
    list:
      collapsible:
        collapsed: true
        summary: '{title_th}'
    fields:
    - name: title_th
      label: ภาษาไทย
      type: string
      required: true
    - name: title_en
      label: ภาษาอังกฤษ
      type: string
      required: true
- name: publications
  label: ผลงานวิจัย / Publications
  type: file
  path: _data/publications.json
  format: json
  fields:
  - name: year
    label: ปี ค.ศ.
    type: number
    required: true
  - name: type
    label: ประเภท
    type: select
    required: true
    options:
      values:
      - name: journal
        label: วารสาร
      - name: conference
        label: ประชุมวิชาการ
  - name: title
    label: ชื่อบทความต้นฉบับ / Original published title
    type: text
    required: true
    description: คงชื่อบทความตามต้นฉบับในทั้งสองภาษา / The published title stays unchanged in both languages.
  - name: language
    label: ภาษาชื่อบทความ
    type: select
    required: true
    options:
      values:
      - name: th
        label: ไทย
      - name: en
        label: English
  - name: category
    label: หัวข้อย่อยเดิม (สำรอง) / Original category (fallback)
    type: string
    required: true
  - name: category_th
    label: หัวข้อย่อยภาษาไทย / Thai category
    type: string
    required: false
  - name: category_en
    label: หัวข้อย่อยภาษาอังกฤษ / English category
    type: string
    required: false
  - name: citation
    label: วารสาร/การประชุม เล่ม ฉบับ หน้า และวันที่
    type: text
    required: true
    description: ใช้ข้อมูลอ้างอิงตามต้นฉบับ / Keep the original bibliographic details.
  - name: authorship
    label: ลำดับผู้เขียนและบทบาท (ไทย / TH)
    type: string
    required: false
    description: ใช้ลำดับและบทบาทตามบทความต้นฉบับ / Use the author order and role stated in the published article.
  - name: authorship_en
    label: ลำดับผู้เขียนและบทบาท (อังกฤษ / EN)
    type: string
    required: false
    description: เว้นว่างเพื่อใช้ข้อความภาษาไทย / Leave blank to use the Thai text.
  - name: summary
    label: สรุปหัวข้องานวิจัย (ไทย / TH)
    type: text
    required: false
  - name: summary_en
    label: สรุปหัวข้องานวิจัย (อังกฤษ / EN)
    type: text
    required: false
    description: เว้นว่างเพื่อใช้ข้อความภาษาไทย / Leave blank to use the Thai text.
  - name: cover_image
    label: รูปปกวารสาร / Journal cover
    type: image
    required: false
    description: ใช้ปกฉบับที่ตรงกับบทความ หรือระบุให้ชัดว่าเป็นภาพปกวารสารทั่วไป เว้นว่างได้ / Use the matching issue cover, or clearly label a general journal cover. Leave blank when unavailable.
    options:
      extensions:
      - jpg
      - jpeg
      - png
      - webp
  - name: cover_alt
    label: คำอธิบายรูปปก (ไทย / TH)
    type: string
    required: false
    description: ระบุชื่อวารสารและฉบับที่ตรงกับภาพ หรือระบุว่าเป็นภาพทั่วไป / Name the journal and matching issue, or label it as a general cover.
  - name: cover_alt_en
    label: คำอธิบายรูปปก (อังกฤษ / EN)
    type: string
    required: false
  - name: cover_caption
    label: ข้อความใต้ปก (ไทย / TH)
    type: string
    required: false
  - name: cover_caption_en
    label: ข้อความใต้ปก (อังกฤษ / EN)
    type: string
    required: false
  - name: cover_source
    label: แหล่งที่มาของปก / Cover source
    type: string
    required: false
    description: ลิงก์หน้าฉบับวารสารหรือไฟล์ปกจากสำนักพิมพ์ / Publisher issue page or original cover file.
    pattern:
      regex: ^(https://[^\s]+)?$
      message: ใส่ลิงก์ HTTPS ที่ถูกต้อง หรือเว้นว่าง / Use an HTTPS URL or leave blank.
  - name: url
    label: ลิงก์บทความ / DOI (ถ้ามี)
    type: string
    required: false
    pattern:
      regex: ^(https://[^\s]+)?$
      message: ใส่ลิงก์ HTTPS ที่ถูกต้อง หรือเว้นว่างหากยังไม่มีลิงก์
  - name: topics
    label: คำสำคัญสำหรับค้นหา
    type: string
    required: false
    description: คั่นคำด้วยช่องว่าง ใช้ได้ทั้งไทยและอังกฤษ
  list: true
